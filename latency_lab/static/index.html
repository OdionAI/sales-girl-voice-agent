<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk to Helen</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #241936;
      background: #fbfaf8;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    .page { position: relative; width: 100%; height: 100dvh; min-height: 100dvh; overflow: hidden; background: #fbfaf8; }
    .pre-call {
      position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: #fbfaf8; transition: opacity .2s ease, visibility .2s ease;
    }
    .pre-call.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .pre-card {
      width: 100%; max-width: 340px; padding: 20px; border: 1px solid #e7e3df; border-radius: 28px;
      background: rgba(253,252,250,.96); box-shadow: 0 24px 100px rgba(31,20,46,.10); backdrop-filter: blur(20px);
    }
    .pre-copy { text-align: center; }
    .pre-copy h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.02em; }
    .pre-copy p { margin: 7px 0 0; color: rgba(36,25,54,.46); font-size: 13px; line-height: 1.55; }
    .contact-input {
      width: 100%; height: 48px; margin-top: 18px; padding: 0 20px; border: 1px solid #e7e3df; border-radius: 999px;
      color: #241936; background: #f4f1ee; font-size: 14px; outline: none;
    }
    .contact-input::placeholder { color: rgba(36,25,54,.28); }
    .contact-input:focus { border-color: #d7d0ca; }
    .call-notice { display: none; margin: 12px 4px 0; color: #842723; font-size: 13px; font-weight: 600; line-height: 1.45; text-align: center; }
    .call-notice.visible { display: block; }
    .start-call {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px;
      margin-top: 12px; padding: 0 20px; border: 0; border-radius: 999px; color: #fff; background: #842723;
      font-size: 14px; font-weight: 500; transition: background .16s ease, opacity .16s ease;
    }
    .start-call:hover { background: #96302b; }
    .start-call:disabled { opacity: .55; }
    .call-stage { position: relative; z-index: 1; width: 100%; height: 100%; background: #fbfaf8; }
    .latency-strip {
      position: absolute; top: 12px; left: 50%; z-index: 50; display: grid; grid-template-columns: repeat(5, minmax(0,1fr));
      width: min(760px, calc(100% - 24px)); padding: 8px; gap: 6px; transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.1); border-radius: 16px; color: #fff; background: rgba(16,10,28,.92);
      box-shadow: 0 18px 48px rgba(0,0,0,.18); backdrop-filter: blur(18px);
    }
    .metric { min-width: 0; padding: 7px 8px; border-radius: 12px; text-align: center; background: rgba(255,255,255,.06); }
    .metric-label { overflow: hidden; color: rgba(255,255,255,.45); font-size: 9px; font-weight: 500; letter-spacing: .12em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .metric-value { overflow: hidden; margin-top: 2px; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    #status { color: #fff; }
    .stage-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; transform: translateY(-30px); }
    .agent { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .avatar-orb { position: relative; display: flex; align-items: center; justify-content: center; width: 172px; height: 172px; }
    .avatar-ring { position: absolute; width: 169px; height: 169px; border: 1px solid rgba(215,71,123,.24); border-radius: 50%; opacity: 0; }
    .avatar-glow { position: absolute; width: 158px; height: 158px; border-radius: 50%; background: radial-gradient(circle,rgba(255,98,181,.14) 0%,rgba(105,132,255,.12) 46%,rgba(255,255,255,0) 72%); filter: blur(22px); opacity: .1; }
    .avatar-frame {
      position: relative; width: 135px; height: 135px; padding: 6px; overflow: hidden; border: 1px solid #d9d4dd;
      border-radius: 50%; background: #fff; box-shadow: 0 20px 50px rgba(31,20,46,.10); transition: transform .18s ease;
    }
    .avatar-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .agent-state { min-height: 20px; margin: 0; color: #7d7592; font-size: 14px; font-weight: 500; }
    .call-stage[data-state="listening"] .avatar-glow { animation: listen 1.5s ease-in-out infinite; }
    .call-stage[data-state="thinking"] .avatar-glow { animation: think .95s ease-in-out infinite; }
    .call-stage[data-state="speaking"] .avatar-ring { animation: speak-ring .72s ease-in-out infinite; }
    .call-stage[data-state="speaking"] .avatar-frame { animation: speak-avatar .72s ease-in-out infinite; }
    @keyframes listen { 0%,100% { opacity:.1; transform:scale(1) } 50% { opacity:.2; transform:scale(1.07) } }
    @keyframes think { 0%,100% { opacity:.18; transform:scale(1) } 45% { opacity:.34; transform:scale(1.12) } }
    @keyframes speak-ring { 0%,100% { opacity:.18; transform:scale(.92) } 50% { opacity:.48; transform:scale(1.18) } }
    @keyframes speak-avatar { 0%,100% { transform:scale(1) } 50% { transform:scale(1.035) } }
    .dock-wrap { position: absolute; right: 0; bottom: 94px; left: 0; display: flex; justify-content: center; padding: 0 14px; }
    .dock { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid #e6e2de; border-radius: 999px; background: #fdfcfa; box-shadow: 0 18px 40px rgba(31,20,46,.08); }
    .dock-button {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
      border: 1px solid #e6e2e0; border-radius: 50%; color: #241936; background: #eceae9; transition: background .15s ease;
    }
    .dock-button:hover:not(:disabled) { background: #e2dfdd; }
    .dock-button img, .dock-button svg { width: 18px; height: 18px; object-fit: contain; }
    .dock-button.end { width: auto; gap: 8px; padding: 0 16px; border-color: #ffbfc0; color: #8f181f; background: #ffb4b6; }
    .dock-button.end:hover { background: #ffa5a8; }
    .dock-button.end img { width: 14px; height: 14px; }
    .dock-button.end span { font-size: 12px; font-weight: 500; }
    .dock-button.is-active { outline: 2px solid rgba(132,39,35,.16); outline-offset: 1px; }
    .transcript {
      position: absolute; top: 72px; right: 20px; bottom: 156px; z-index: 40; display: flex; flex-direction: column;
      width: min(360px, calc(100% - 40px)); overflow: hidden; border: 1px solid #e9e6e1; border-radius: 24px;
      background: rgba(255,255,255,.92); box-shadow: 0 18px 48px rgba(0,0,0,.18); backdrop-filter: blur(20px);
      opacity: 0; transform: translateX(24px); visibility: hidden; pointer-events: none; transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
    }
    .transcript.open { opacity: 1; transform: translateX(0); visibility: visible; pointer-events: auto; }
    .transcript-head { display: flex; align-items: center; justify-content: space-between; min-height: 57px; padding: 0 20px; border-bottom: 1px solid #ece8e2; }
    .transcript-head p { margin: 0; font-size: 14px; font-weight: 600; }
    .report-link { color: rgba(36,25,54,.48); font-size: 11px; font-weight: 600; text-decoration: none; }
    .report-link:hover { color: #842723; }
    #messages { min-height: 0; flex: 1; overflow-y: auto; padding: 16px; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: rgba(36,25,54,.4); font-size: 13px; line-height: 1.5; text-align: center; }
    .bubble { max-width: 88%; margin: 0 0 12px; padding: 12px 16px; border-radius: 18px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
    .bubble.user { margin-left: auto; color: #121212; background: #fff; box-shadow: 0 0 0 1px #ece8e2; }
    .bubble.assistant { color: rgba(36,25,54,.78); background: #f6f3ef; box-shadow: 0 0 0 1px #ece8e2; }
    .bubble.partial { opacity: .58; }
    .session-meta { display: none; }
    @media (max-width: 640px) {
      .latency-strip { top: 8px; width: calc(100% - 16px); }
      .metric { padding: 6px 3px; }
      .metric-label { font-size: 8px; }
      .transcript { top: 68px; right: 12px; bottom: 154px; width: calc(100% - 24px); }
      .dock { gap: 4px; padding: 7px; }
      .dock-button { width: 34px; height: 34px; }
      .dock-button.end { padding: 0 12px; }
      .dock-button.end span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="pre-call" class="pre-call">
      <div class="pre-card">
        <div class="pre-copy">
          <h1>Talk to Zenith Bank</h1>
          <p>Enter your email or phone number to start the call.</p>
        </div>
        <input class="contact-input" type="text" inputmode="email" autocomplete="tel email" placeholder="Email or phone (+229...)" aria-label="Email or phone">
        <p id="call-notice" class="call-notice" role="status" aria-live="polite"></p>
        <button id="start" class="start-call" type="button">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15.55 12.1c-.78-.08-1.55.05-2.27.36l-1.1.47a1.55 1.55 0 0 1-1.74-.31L7.39 9.56a1.55 1.55 0 0 1-.31-1.74l.47-1.1a3.9 3.9 0 0 0 .36-2.27A1.9 1.9 0 0 0 6.03 2.8H4.2A1.7 1.7 0 0 0 2.5 4.5c0 7.18 5.82 13 13 13a1.7 1.7 0 0 0 1.7-1.7v-1.83a1.9 1.9 0 0 0-1.65-1.87Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Start call</span>
        </button>
      </div>
    </section>

    <section id="call-stage" class="call-stage" data-state="idle">
      <div class="latency-strip" aria-label="Local voice latency">
        <div class="metric"><div class="metric-label">System</div><div id="status" class="metric-value">Idle</div></div>
        <div class="metric"><div class="metric-label">Pipeline</div><div class="metric-value">RVC</div></div>
        <div class="metric"><div class="metric-label">STT</div><div class="metric-value">RSTT</div></div>
        <div class="metric"><div class="metric-label">LLM</div><div class="metric-value">RLLM</div></div>
        <div class="metric"><div class="metric-label">TTS</div><div class="metric-value">RTTS</div></div>
      </div>

      <div class="stage-center">
        <div class="agent">
          <div class="avatar-orb" aria-label="Helen">
            <div class="avatar-ring"></div>
            <div class="avatar-glow"></div>
            <div class="avatar-frame"><img src="/helen-assets/AI-avatar-2.svg" alt="Helen"></div>
          </div>
          <p id="stage-status" class="agent-state">Ready to call</p>
        </div>
      </div>

      <aside id="transcript" class="transcript" aria-label="Live transcript">
        <div class="transcript-head">
          <p>Live transcript</p>
          <a class="report-link" href="/reports/latest" target="_blank" rel="noreferrer">Latest report</a>
        </div>
        <section id="messages"></section>
      </aside>

      <div class="dock-wrap">
        <div class="dock" aria-label="Call controls">
          <button class="dock-button" type="button" title="Microphone active" aria-label="Microphone active" disabled><img src="/helen-assets/microphone.svg" alt=""></button>
          <button class="dock-button" type="button" title="Video off" aria-label="Video off" disabled><img src="/helen-assets/video-recorder-off.svg" alt=""></button>
          <button class="dock-button" type="button" title="Casting controls" aria-label="Casting controls" disabled><img src="/helen-assets/chrome-cast.svg" alt=""></button>
          <button id="transcript-toggle" class="dock-button" type="button" title="Show transcript" aria-label="Show transcript"><img src="/helen-assets/message-dots-circle.svg" alt=""></button>
          <button class="dock-button" type="button" title="More" aria-label="More" disabled><img src="/helen-assets/more-dots.svg" alt=""></button>
          <button id="stop" class="dock-button end" type="button" title="End call" aria-label="End call"><img src="/helen-assets/phone-hang-up.svg" alt=""><span>END CALL</span></button>
        </div>
      </div>
      <span id="session" class="session-meta">—</span>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
