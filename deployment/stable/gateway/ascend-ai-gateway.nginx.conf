server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Gateway catalog
    location = / {
        default_type application/json;
        return 200 '{"service":"ascend-ai-gateway","status":"ok","endpoints":{"asr":"/asr/v1","asr_realtime":"/asr-rt/v1/realtime","tts":"/tts/v1","llm":"/llm/v1","vl":"/vl/v1","qwen38":"/qwen38/v1","qwen38_standard":"/qwen38-standard/v1","fara15":"/fara15/v1","health":"/health"}}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Qwen3-ASR batch  -> 10.205.50.7:8093
    location /asr/ {
        proxy_pass http://10.205.50.7:8093/;
    }

    # Qwen3-ASR realtime WebSocket  -> 10.205.50.7:8093
    location /asr-rt/ {
        proxy_pass http://10.205.50.7:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Qwen3-TTS  -> 10.205.50.7:8091
    location /tts/ {
        proxy_pass http://10.205.50.7:8091/;
    }

    # DeepSeek   -> 10.205.50.8:7000
    location /llm/ {
        proxy_pass http://10.205.50.8:7000/;
    }

    # Qwen3-VL   -> 10.205.50.7:8000
    location /vl/ {
        proxy_pass http://10.205.50.7:8000/;
    }

    # Qwen 3.8 27B DFlash2 multimodal -> 10.205.50.8:8100
    location /qwen38/ {
        proxy_pass http://10.205.50.8:8100/;
    }

    # Qwen 3.8 27B standard MTP with prefix caching -> 10.205.50.7:8095
    location /qwen38-standard/ {
        proxy_pass http://10.205.50.7:8095/;
    }

    # Fara 1.5 27B multimodal -> 10.205.50.7:8096
    location /fara15/ {
        proxy_pass http://10.205.50.7:8096/;
    }

    location /qwen3-vl/ {
        proxy_pass http://10.205.50.7:9005/;
    }
}

# Drop-in OpenAI-compatible ports (same paths as upstream: /v1/...)
