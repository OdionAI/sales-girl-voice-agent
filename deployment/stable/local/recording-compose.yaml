services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
  egress:
    image: livekit/egress:v1.14.1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /config/egress.yaml
    volumes:
      - "${RECORDING_RUNTIME_DIR}/egress.yaml:/config/egress.yaml:ro"
      - "${RECORDING_RUNTIME_DIR}/audio:/out"
    ports:
      - "127.0.0.1:7981:7981"
