[package]
name = "sg-voice-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
local-call = ["rvc", "dep:axum"]
rvc = ["rtc", "dep:reqwest", "dep:regex", "dep:base64", "dep:hmac", "dep:sha2", "dep:jsonschema", "dep:uuid", "dep:chrono", "dep:nnnoiseless", "dep:unicode-normalization", "dep:rusqlite", "dep:webauthn-rs", "dep:dotenvy"]
rtc = ["api", "dep:livekit"]
api = ["worker", "livekit-api/services"]
worker = ["dep:livekit-api", "dep:livekit-protocol", "dep:prost", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
dotenvy = { version = "=0.15.7", optional = true }
axum = { version = "=0.8.9", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
livekit = { version = "=0.10.0", optional = true }
livekit-api = { version = "=0.10.0", optional = true, default-features = false, features = ["access-token"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "test-util"] }
futures-util = { version = "=0.3.31", optional = true }

livekit-protocol = { version = "=0.8.2", optional = true }
prost = { version = "=0.14.4", optional = true }
tokio-tungstenite = { version = "=0.28.0", optional = true, features = ["rustls-tls-webpki-roots"] }

reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["json", "stream", "multipart", "rustls"] }
regex = { version = "=1.13.1", optional = true }
base64 = { version = "=0.22.1", optional = true }
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }

jsonschema = { version = "=0.46.10", optional = true, default-features = false }

uuid = { version = "=1.29.0", optional = true, features = ["v4"] }
chrono = { version = "=0.4.45", optional = true }
nnnoiseless = { version = "=0.5.2", optional = true, default-features = false }
unicode-normalization = { version = "=0.1.25", optional = true }
rusqlite = { version = "=0.38.0", optional = true, features = ["bundled"] }
webauthn-rs = { version = "=0.6.2", optional = true, default-features = false }

[[bin]]
name = "rtc-smoke"
path = "src/bin/rtc_smoke.rs"
required-features = ["rtc"]

[[bin]]
name = "native-worker-smoke"
path = "src/bin/native_worker_smoke.rs"
required-features = ["rtc"]

[[bin]]
name = "worker-control-smoke"
path = "src/bin/worker_control_smoke.rs"
required-features = ["api"]

[dev-dependencies]
axum = { version = "=0.8.9", features = ["ws", "multipart"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
serde_cbor_2 = "=0.13.0"

[[bin]]
name = "rvc-worker"
path = "src/bin/rvc_worker.rs"
required-features = ["rvc"]

[[bin]]
name = "rvc-local-call"
path = "src/bin/rvc_local_call.rs"
required-features = ["local-call"]

[[bin]]
name = "rvc-noise-review"
path = "src/bin/rvc_noise_review.rs"
required-features = ["rvc"]
