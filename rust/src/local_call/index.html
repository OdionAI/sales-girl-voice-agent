<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helen · Local Rust call</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182c32;background:#f4f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{max-width:820px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px}header strong{letter-spacing:2px}.badge{background:#e2ede6;padding:8px 12px;border-radius:30px;color:#36644a}.intro{text-align:center;padding:58px 0 30px}h1{font-size:44px;letter-spacing:-1.8px;margin:22px 0 12px;font-weight:650}p{color:#5c6d70;line-height:1.6}.orb{width:110px;height:110px;margin:auto;border-radius:50%;background:radial-gradient(circle at 32% 28%,#9fcfbe,#307c71 68%,#24534f);box-shadow:0 0 0 15px #e7eeeb,0 0 0 30px #eff3f0;display:grid;place-items:center;color:white;font-size:36px;font-weight:500}.speaking{animation:breathe 1.2s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 0 0 20px #ddebe4,0 0 0 40px #e9f1ec}}#status{display:block;color:#38665b;font-size:14px;min-height:24px;margin:28px 0 16px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:30px;padding:14px 23px;background:#235d52;color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e4eae7;color:#354c46}button.end{background:#f5e2df;color:#923c34}button:focus-visible{outline:3px solid #6ba4e3;outline-offset:3px}#error{color:#9a3b31;text-align:center;min-height:24px}.transcripts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}.card{background:white;border:1px solid #e0e7e3;border-radius:18px;padding:22px;min-height:190px}.label{font-size:11px;letter-spacing:1.8px;font-weight:700;color:#668077}.words{font-size:17px;line-height:1.6;white-space:pre-wrap;margin-top:16px}.placeholder{color:#96a49e;font-style:italic}footer{text-align:center;font-size:12px;color:#82918a;margin-top:28px}audio{display:none}@media(max-width:600px){main{padding-top:26px}.intro{padding-top:50px}h1{font-size:34px}.transcripts{grid-template-columns:1fr}.card{min-height:130px}}
</style>
<main><header><strong>RUST VOICE LAB</strong><span class="badge">On this Mac</span></header>
<section class="intro"><div id="orb" class="orb" aria-hidden="true">H</div><h1>Talk to Helen, locally.</h1><p>Your Rust voice worker, connected to the existing<br>ASR, DeepSeek and Helen voice services.</p><span id="status" role="status" aria-live="polite">Ready when you are</span>
<div class="controls"><button id="start">Start call</button><button id="mute" class="secondary" disabled>Mute microphone</button><button id="hangup" class="end" disabled>End call</button><button id="audio" class="secondary" hidden>Enable sound</button></div></section>
<div id="error" role="alert"></div><section class="transcripts"><article class="card"><div class="label">YOU</div><div id="you" class="words placeholder">Your words will appear here.</div></article><article class="card"><div class="label">HELEN</div><div id="agent" class="words placeholder">Helen’s reply will appear here.</div></article></section><div id="sound"></div><footer>Speak naturally. You can interrupt Helen while she is talking.</footer></main>
<script src="/sdk.js"></script><script>
const $=id=>document.getElementById(id);let room=null,session=null,mic=null,muted=false,readySent=false,timer=null;
const status=text=>$('status').textContent=text;
const words=(id,text)=>{const el=$(id);el.textContent=text;el.classList.remove('placeholder');};
async function api(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.error||'Local call failed');return result;}
async function stop(){clearTimeout(timer);$('hangup').disabled=true;$('mute').disabled=true;status('Call ended');const r=room,s=session;room=null;session=null;if(mic){mic.stop();mic=null;}if(r)await r.disconnect();$('sound').replaceChildren();if(s)await api('/api/end',{room:s.room}).catch(()=>{});$('start').disabled=false;$('hangup').disabled=true;$('mute').disabled=true;$('audio').hidden=true;$('orb').classList.remove('speaking');status('Call ended — start again anytime');}
$('start').onclick=async()=>{if(room)return;$('error').textContent='';$('start').disabled=true;$('hangup').disabled=false;readySent=false;muted=false;$('mute').textContent='Mute microphone';status('Allow your microphone to connect');
 try{const {Room,RoomEvent,Track,createLocalAudioTrack}=LivekitClient;room=new Room();const current=room;current.startAudio().catch(()=>{$('audio').hidden=false;});
 current.on(RoomEvent.TrackSubscribed,(track)=>{if(track.kind===Track.Kind.Audio){const el=track.attach();el.autoplay=true;$('sound').append(el);el.play().catch(()=>{$('audio').hidden=false;});}});
 current.on(RoomEvent.ActiveSpeakersChanged,list=>{$('orb').classList.toggle('speaking',list.some(p=>p.identity!=='sg-rvc-caller'));});
 current.on(RoomEvent.AudioPlaybackStatusChanged,()=>{$('audio').hidden=current.canPlaybackAudio;});
 current.on(RoomEvent.DataReceived,async(payload,participant,kind,topic)=>{if(room!==current||topic!=='sg-rvc.status'||!participant?.identity.startsWith('sg-rust-'))return;let m;try{m=JSON.parse(new TextDecoder().decode(payload));}catch{return;}
  if(m.type==='ready'&&!readySent){readySent=true;clearTimeout(timer);await current.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({type:'client_ready'})),{reliable:true,topic:'sg-rvc.control'});status('Helen is ready — say hello');}
  if(m.type==='partial'){words('you',m.text);status('Listening…');}if(m.type==='final'){words('you',m.text);status('Preparing a reply…');}if(m.type==='answer'){words('agent',m.text);status('Helen is speaking…');}if(m.type==='complete')status('Listening — you can keep talking');if(m.type==='status')status(m.content);if(m.type==='error'){$('error').textContent=m.error;status('Ready for another utterance');}
 });
 current.on(RoomEvent.Disconnected,()=>{if(room===current)stop();});
 const captured=await createLocalAudioTrack({echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1});if(room!==current){captured.stop();return;}mic=captured;status('Connecting the local call…');const created=await api('/api/session');if(room!==current){await api('/api/end',{room:created.room});return;}session=created;await current.connect(created.url,created.token);if(room!==current){await current.disconnect();return;}await current.localParticipant.publishTrack(captured,{source:Track.Source.Microphone});if(room!==current)return;$('mute').disabled=false;await api('/api/dispatch',{room:session.room});status('Starting the Rust agent…');timer=setTimeout(()=>{if(!readySent){$('error').textContent='The local worker is taking too long. End the call and try again.';}},30000);
 }catch(e){$('error').textContent=e.name==='NotAllowedError'?'Microphone access was blocked. Allow the microphone in Chrome and try again.':e.message;await stop();}};
$('hangup').onclick=stop;$('audio').onclick=()=>room?.startAudio().then(()=>{$('audio').hidden=true;});$('mute').onclick=async()=>{if(!mic)return;muted=!muted;await(muted?mic.mute():mic.unmute());$('mute').textContent=muted?'Unmute microphone':'Mute microphone';};
window.addEventListener('pagehide',()=>{mic?.stop();if(session)navigator.sendBeacon('/api/end',new Blob([JSON.stringify({room:session.room})],{type:'application/json'}));room?.disconnect();});
</script></html>
