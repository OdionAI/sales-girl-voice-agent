name: Deploy Voice Agent

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: sales-girl-voice-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      GCP_PROJECT_ID: ${{ github.ref_name == 'main' && vars.GCP_PROJECT_ID_PROD || vars.GCP_PROJECT_ID_STAGING }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      GCP_ZONE: ${{ github.ref_name == 'main' && vars.GCP_ZONE_PROD || vars.GCP_ZONE_STAGING }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'backend' }}
      VM_USER: ${{ vars.VOICE_AGENT_VM_USER || 'salesgirl' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref_name == 'main' && secrets.GCP_SA_KEY_PROD || secrets.GCP_SA_KEY_STAGING }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Push release image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE_BASE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_SHA="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:${DEPLOY_ENV}-latest"
          docker build -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

      - name: Resolve VM Name
        run: |
          VM_NAME="sales-girl-voice-agent-${DEPLOY_ENV}"
          echo "VM_NAME=${VM_NAME}" >> "${GITHUB_ENV}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ github.ref_name == 'main' && secrets.VOICE_AGENT_SSH_PRIVATE_KEY_PROD || secrets.VOICE_AGENT_SSH_PRIVATE_KEY_STAGING }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy on VM
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          REPO_BRANCH: ${{ github.ref_name }}
          REPO_TOKEN: ${{ github.ref_name == 'main' && secrets.VOICE_AGENT_REPO_TOKEN_PROD || secrets.VOICE_AGENT_REPO_TOKEN_STAGING }}
        run: |
          gcloud compute ssh "${VM_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-file ~/.ssh/id_rsa \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command "\
            export ENVIRONMENT='${DEPLOY_ENV}' && \
            export VM_USER='${VM_USER}' && \
            export REPO_URL='${REPO_URL}' && \
            export REPO_BRANCH='${REPO_BRANCH}' && \
            export GITHUB_TOKEN='${REPO_TOKEN}' && \
            if [ -x /opt/sales-girl-voice-agent/scripts/deploy.sh ]; then \
              /opt/sales-girl-voice-agent/scripts/deploy.sh; \
            else \
              /opt/sales-girl-voice-agent/sales-girl-voice-agent/scripts/deploy.sh; \
            fi"
