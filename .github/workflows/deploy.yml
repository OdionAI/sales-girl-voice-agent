name: Deploy Voice Agent

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_DIR: sales-girl-voice-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      TARGET_HOST: ${{ github.ref_name == 'main' && secrets.HUAWEI_NODE_B_HOST_PROD || secrets.HUAWEI_NODE_B_HOST_STAGING }}
      TARGET_USER: ${{ secrets.HUAWEI_SSH_USER || 'root' }}
      TARGET_STACK_DIR: ${{ github.ref_name == 'main' && (vars.HUAWEI_NODE_B_STACK_DIR_PROD || '/opt/salesgirl/node-b-prod') || (vars.HUAWEI_NODE_B_STACK_DIR_STAGING || '/opt/salesgirl/node-b-staging') }}
      TARGET_SRC_ROOT: ${{ vars.HUAWEI_SRC_ROOT || '/opt/salesgirl/src' }}
      COMPOSE_PROJECT_NAME: ${{ github.ref_name == 'main' && (vars.HUAWEI_COMPOSE_PROJECT_PROD || 'salesgirl-prod') || (vars.HUAWEI_COMPOSE_PROJECT_STAGING || 'salesgirl-staging') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GOOGLE_API_KEY: dummy-test-key
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build image
        run: docker build -t sales-girl-voice-agent:ci .

      - name: Install SSH key
        run: |
          test -n "${TARGET_HOST}" || (echo "Missing Huawei target host for ${DEPLOY_ENV}" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HUAWEI_SSH_PRIVATE_KEY }}" > ~/.ssh/huawei_deploy_key
          chmod 600 ~/.ssh/huawei_deploy_key

      - name: Upload source and deploy voice workers
        run: |
          set -euo pipefail
          REMOTE_RELEASE="${TARGET_SRC_ROOT}/.releases/${REPO_DIR}/${GITHUB_SHA}"
          REMOTE_CURRENT="${TARGET_SRC_ROOT}/${REPO_DIR}"
          SSH=(ssh -i ~/.ssh/huawei_deploy_key -o StrictHostKeyChecking=no "${TARGET_USER}@${TARGET_HOST}")

          "${SSH[@]}" "mkdir -p '${REMOTE_RELEASE}' '${TARGET_SRC_ROOT}'"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            -czf - . | "${SSH[@]}" "tar -xzf - -C '${REMOTE_RELEASE}'"

          "${SSH[@]}" "\
            set -euo pipefail && \
            ln -sfn '${REMOTE_RELEASE}' '${REMOTE_CURRENT}' && \
            cd '${TARGET_STACK_DIR}' && \
            COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' docker compose --env-file .env.node-b build voice-agent-en voice-agent-fr && \
            COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' docker compose --env-file .env.node-b up -d --no-deps --force-recreate voice-agent-en voice-agent-fr && \
            COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' docker compose --env-file .env.node-b ps voice-agent-en voice-agent-fr && \
            docker image prune -f"
