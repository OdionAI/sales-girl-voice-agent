name: Deploy staging voice worker

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check the current staging worker and SSH route without deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: staging-voice-release
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref_name == 'dev' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test worker release
        if: github.event_name == 'push' || !inputs.verify_only
        run: |
          python -m pip install -r requirements.txt -r latency_lab/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s latency_lab/tests -p 'test_*.py'
      - name: Configure pinned staging SSH route
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          cp deployment/staging/known_hosts ~/.ssh/staging_known_hosts
          cp deployment/staging/ssh_config ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/staging_known_hosts
          ssh-keygen -y -f ~/.ssh/staging_deploy_key >/dev/null
          ssh staging-app python3 - --verify-only < deployment/staging/deploy.py
      - name: Build and deploy exact Git revision
        if: github.event_name == 'push' || !inputs.verify_only
        env:
          ENABLE_HAUSA_RESEARCH: ${{ vars.ENABLE_HAUSA_TWB_VOICES || 'false' }}
          REPLY_GRACE_MS: ${{ vars.RVC_LAB_REPLY_GRACE_MS || '0' }}
          REPLY_GRACE_AGENT_IDS: ${{ vars.RVC_LAB_REPLY_GRACE_AGENT_IDS || '' }}
          LLM_PROVIDER: ${{ vars.RVC_LAB_LLM_PROVIDER || 'qwen' }}
          DEEPSEEK_MODEL: ${{ vars.RVC_LAB_DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_REASONING_EFFORT: ${{ vars.RVC_LAB_DEEPSEEK_REASONING_EFFORT || 'high' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          set -euo pipefail
          [[ "$REPLY_GRACE_MS" =~ ^[0-9]{1,4}$ ]] || { printf 'Invalid RVC_LAB_REPLY_GRACE_MS value\n' >&2; exit 1; }
          [[ "$REPLY_GRACE_AGENT_IDS" =~ ^[0-9a-fA-F,-]*$ ]] || { printf 'Invalid RVC_LAB_REPLY_GRACE_AGENT_IDS value\n' >&2; exit 1; }
          [[ "$LLM_PROVIDER" == qwen || "$LLM_PROVIDER" == deepseek ]] || { printf 'Invalid RVC_LAB_LLM_PROVIDER value\n' >&2; exit 1; }
          [[ "$DEEPSEEK_REASONING_EFFORT" == low || "$DEEPSEEK_REASONING_EFFORT" == high || "$DEEPSEEK_REASONING_EFFORT" == max ]] || { printf 'Invalid DeepSeek reasoning effort\n' >&2; exit 1; }
          llm_args=(--llm-provider "$LLM_PROVIDER" --deepseek-model "$DEEPSEEK_MODEL" --deepseek-reasoning-effort "$DEEPSEEK_REASONING_EFFORT")
          research_args=()
          case "$ENABLE_HAUSA_RESEARCH" in
            true) research_args+=(--enable-hausa-research) ;;
            false) ;;
            *) printf 'Invalid ENABLE_HAUSA_TWB_VOICES value\n' >&2; exit 1 ;;
          esac
          release="/opt/attentive/releases/voice-ci/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh staging-app "install -d -m 700 '$release'"
          git archive HEAD | ssh staging-app "tar -xf - --no-same-owner -C '$release'"
          if [[ "$LLM_PROVIDER" == deepseek ]]; then
            test -n "$DEEPSEEK_API_KEY"
            printf '%s' "$DEEPSEEK_API_KEY" | ssh staging-app python3 "$release/deployment/staging/deploy.py" --release "$release" --revision "$GITHUB_SHA" --reply-grace-ms "$REPLY_GRACE_MS" --reply-grace-agent-ids "$REPLY_GRACE_AGENT_IDS" "${research_args[@]}" "${llm_args[@]}" --deepseek-api-key-stdin
          else
            ssh staging-app python3 "$release/deployment/staging/deploy.py" --release "$release" --revision "$GITHUB_SHA" --reply-grace-ms "$REPLY_GRACE_MS" --reply-grace-agent-ids "$REPLY_GRACE_AGENT_IDS" "${research_args[@]}" "${llm_args[@]}"
          fi
          printf 'Staging voice revision `%s` is deployed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/staging_deploy_key
