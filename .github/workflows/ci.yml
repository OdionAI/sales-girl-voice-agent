name: Voice Agent CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  rvc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install RVC dependencies
        run: pip install -r latency_lab/requirements.txt
      - name: RVC regression tests
        run: python -m unittest discover -s latency_lab/tests -p 'test_*.py'
      - name: Yinka deployment helper tests
        run: |
          python -m pip install 'requests>=2.32,<3'
          python -m unittest discover -s deployment/stable/npu/yinka -p 'test_*.py' -v

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Docker image
        run: docker build -t sales-girl-voice-agent:ci .
