name: Voice Agent CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Docker image
        run: docker build -t sales-girl-voice-agent:ci .

  passkey-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated worker dependencies
        run: pip install -r latency_lab/requirements.txt
      - name: Verify passkey flows, demo proofs, intent gates and worker regressions
        run: python -m unittest latency_lab.tests.test_passkey latency_lab.tests.test_passkey_app_message latency_lab.tests.test_passkey_demo latency_lab.tests.test_passkey_diagnostics latency_lab.tests.test_engagement latency_lab.tests.test_livekit_transport latency_lab.tests.test_pidgin latency_lab.tests.test_speech_languages -v
      - name: Verify provider timing and transfer release invariants
        run: python -m unittest latency_lab.tests.test_llm_observability latency_lab.tests.test_llm_stall_timeout latency_lab.tests.test_live_metrics latency_lab.tests.test_tts_seed -v

  native-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build native runtime and run native library contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/lagos/Dockerfile
          load: true
          tags: sg-rvc-native:ci
          cache-from: type=gha,scope=sg-rvc-native
          cache-to: type=gha,mode=max,scope=sg-rvc-native
      - name: Verify native registration and health across reconnect
        run: bash deployment/lagos/test-native-runtime.sh sg-rvc-native:ci
