name: Voice Agent CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Docker image
        run: docker build -t sales-girl-voice-agent:ci .

  passkey-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated worker dependencies
        run: pip install -r latency_lab/requirements.txt
      - name: Verify demo proofs, intent gates and worker regressions
        run: python -m unittest latency_lab.tests.test_passkey_demo latency_lab.tests.test_engagement latency_lab.tests.test_livekit_transport latency_lab.tests.test_pidgin latency_lab.tests.test_speech_languages -v
