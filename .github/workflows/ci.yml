name: Voice Agent CI

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Docker image
        run: docker build -t sales-girl-voice-agent:ci .

  passkey-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated worker dependencies
        run: pip install -r latency_lab/requirements.txt
      - name: Run latency worker regression suite
        run: python -m unittest discover -s latency_lab/tests -p 'test_*.py' -v

  rust-tests:
    uses: ./.github/workflows/rust-unit-tests.yml

  native-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build native runtime and run native library contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/lagos/Dockerfile
          load: true
          tags: sg-rvc-native:ci
          build-args: RUN_NATIVE_TESTS=false
          cache-from: type=gha,scope=sg-rvc-native
          cache-to: type=gha,mode=max,scope=sg-rvc-native
      - name: Verify native registration and health across reconnect
        run: bash deployment/lagos/test-native-runtime.sh sg-rvc-native:ci

  native-worker:
    needs: [rust-tests, native-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust tests and native image checks
        env:
          RUST_RESULT: ${{ needs.rust-tests.result }}
          IMAGE_RESULT: ${{ needs.native-image.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$IMAGE_RESULT" = success
