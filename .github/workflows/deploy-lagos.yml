name: Deploy Lagos voice worker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check the current Lagos worker and SSH route without deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lagos-voice-release
  cancel-in-progress: false

jobs:
  rust-tests:
    if: github.ref_name == 'main' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) || (github.event_name == 'workflow_dispatch' && !inputs.verify_only))
    uses: ./.github/workflows/rust-unit-tests.yml
  lagos:
    needs: rust-tests
    if: always() && !cancelled() && ((github.ref_name == 'main' && needs.rust-tests.result == 'success' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) || (github.event_name == 'workflow_dispatch' && !inputs.verify_only))) || (github.event_name == 'workflow_dispatch' && inputs.verify_only && needs.rust-tests.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test worker release
        if: github.event_name == 'push' || !inputs.verify_only
        run: |
          python -m pip install -r requirements.txt -r latency_lab/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s latency_lab/tests -p 'test_*.py'
      - name: Configure pinned Lagos SSH route
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAGOS_SSH_PRIVATE_KEY || secrets.HUAWEI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lagos_deploy_key
          chmod 600 ~/.ssh/lagos_deploy_key
          cp deployment/lagos/known_hosts ~/.ssh/lagos_known_hosts
          cp deployment/lagos/ssh_config ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/lagos_known_hosts
          ssh-keygen -y -f ~/.ssh/lagos_deploy_key >/dev/null
          ssh lagos-app python3 - --verify-only < deployment/lagos/deploy.py
      - name: Build and deploy exact Git revision
        if: github.event_name == 'push' || !inputs.verify_only
        env:
          ENABLE_HAUSA_RESEARCH: ${{ vars.ENABLE_HAUSA_TWB_VOICES || 'false' }}
          MOMO_FEEDBACK_AGENT_ID: ${{ vars.AICC_MOMO_FEEDBACK_AGENT_ID }}
          REPLY_GRACE_MS: ${{ vars.RVC_LAB_REPLY_GRACE_MS || '0' }}
          REPLY_GRACE_AGENT_IDS: ${{ vars.RVC_LAB_REPLY_GRACE_AGENT_IDS || '' }}
          BALOGUN_NUMBER_CAPTURE_ENABLED: ${{ vars.BALOGUN_NUMBER_CAPTURE_ENABLED || 'false' }}
          LLM_PROVIDER: ${{ vars.RVC_LAB_LLM_PROVIDER || 'qwen' }}
          DEEPSEEK_MODEL: ${{ vars.RVC_LAB_DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_REASONING_EFFORT: ${{ vars.RVC_LAB_DEEPSEEK_REASONING_EFFORT || 'high' }}
          WEMA_VOICE_AUTH_COSINE_THRESHOLD: ${{ vars.WEMA_VOICE_AUTH_COSINE_THRESHOLD || '0.60' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          WEMA_BLOB_CONNECTION_STRING: ${{ secrets.WEMA_BLOB_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          test -n "$MOMO_FEEDBACK_AGENT_ID"
          [[ "$REPLY_GRACE_MS" =~ ^[0-9]{1,4}$ ]] || { printf 'Invalid RVC_LAB_REPLY_GRACE_MS value\n' >&2; exit 1; }
          [[ "$REPLY_GRACE_AGENT_IDS" =~ ^[0-9a-fA-F,-]*$ ]] || { printf 'Invalid RVC_LAB_REPLY_GRACE_AGENT_IDS value\n' >&2; exit 1; }
          [[ "$BALOGUN_NUMBER_CAPTURE_ENABLED" == true || "$BALOGUN_NUMBER_CAPTURE_ENABLED" == false ]] || { printf 'Invalid BALOGUN_NUMBER_CAPTURE_ENABLED value\n' >&2; exit 1; }
          [[ "$WEMA_VOICE_AUTH_COSINE_THRESHOLD" =~ ^0\.[0-9]{2}$ ]] || { printf 'Invalid WEMA_VOICE_AUTH_COSINE_THRESHOLD value\n' >&2; exit 1; }
          [[ "$LLM_PROVIDER" == qwen || "$LLM_PROVIDER" == deepseek ]] || { printf 'Invalid RVC_LAB_LLM_PROVIDER value\n' >&2; exit 1; }
          [[ "$DEEPSEEK_REASONING_EFFORT" == low || "$DEEPSEEK_REASONING_EFFORT" == high || "$DEEPSEEK_REASONING_EFFORT" == max ]] || { printf 'Invalid DeepSeek reasoning effort\n' >&2; exit 1; }
          llm_args=(--llm-provider "$LLM_PROVIDER" --deepseek-model "$DEEPSEEK_MODEL" --deepseek-reasoning-effort "$DEEPSEEK_REASONING_EFFORT")
          research_args=()
          number_capture_args=()
          case "$ENABLE_HAUSA_RESEARCH" in
            true) research_args+=(--enable-hausa-research) ;;
            false) ;;
            *) printf 'Invalid ENABLE_HAUSA_TWB_VOICES value\n' >&2; exit 1 ;;
          esac
          case "$BALOGUN_NUMBER_CAPTURE_ENABLED" in
            true) number_capture_args+=(--balogun-number-capture-enabled) ;;
            false) ;;
          esac
          release="/opt/attentive/releases/voice-ci/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh lagos-app "install -d -m 700 '$release'"
          git archive HEAD | ssh lagos-app "tar -xf - --no-same-owner -C '$release'"
          test -n "$WEMA_BLOB_CONNECTION_STRING"
          printf '%s' "$WEMA_BLOB_CONNECTION_STRING" | ssh lagos-app python3 "$release/deployment/lagos/deploy_voice_auth.py" --release "$release" --revision "$GITHUB_SHA" --threshold "$WEMA_VOICE_AUTH_COSINE_THRESHOLD"
          if [[ "$LLM_PROVIDER" == deepseek ]]; then
            test -n "$DEEPSEEK_API_KEY"
            printf '%s' "$DEEPSEEK_API_KEY" | ssh lagos-app python3 "$release/deployment/lagos/deploy.py" --release "$release" --revision "$GITHUB_SHA" --momo-feedback-agent-id "$MOMO_FEEDBACK_AGENT_ID" --reply-grace-ms "$REPLY_GRACE_MS" --reply-grace-agent-ids "$REPLY_GRACE_AGENT_IDS" "${research_args[@]}" "${number_capture_args[@]}" "${llm_args[@]}" --deepseek-api-key-stdin
          else
            ssh lagos-app python3 "$release/deployment/lagos/deploy.py" --release "$release" --revision "$GITHUB_SHA" --momo-feedback-agent-id "$MOMO_FEEDBACK_AGENT_ID" --reply-grace-ms "$REPLY_GRACE_MS" --reply-grace-agent-ids "$REPLY_GRACE_AGENT_IDS" "${research_args[@]}" "${number_capture_args[@]}" "${llm_args[@]}"
          fi
          printf 'Lagos voice revision `%s` is deployed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/lagos_deploy_key
